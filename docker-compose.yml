# AetherTerm - Docker Compose
#
# Usage:
#   docker compose up --build                          # Terminal server
#   docker compose --profile agent up --build          # Terminal + AgentShell observer
#   docker compose logs -f                             # Follow logs
#   docker compose down                                # Stop and remove
#
# Multi-arch build (requires: docker buildx create --use):
#   docker buildx bake --push                          # Build & push all platforms
#
# Access: http://localhost:57575
services:
  # ============================================================
  # ControlServer - System Management & Coordination
  #   - Resides on :8765
  #   - Manages inter-agent communication and session reports
  # ============================================================
  controlserver:
    image: ghcr.io/aether-platform/aetherterm:latest
    container_name: controlserver
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - CONTROL_SERVER_HOST=0.0.0.0
      - CONTROL_SERVER_PORT=8765
    command:
      ["aetherterm-controlserver", "--host=0.0.0.0", "--port=8765", "--debug"]
    restart: unless-stopped

  # ============================================================
  # AetherTerm AgentServer
  #   - Web terminal on :57575
  #   - Simplified FastAPI + WebSocket architecture
  # ============================================================
  aetherterm:
    image: ghcr.io/aether-platform/aetherterm:latest
    container_name: aetherterm
    build:
      context: .
      dockerfile: Dockerfile
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    ports:
      - "57575:57575"
    environment:
      AETHERTERM_HOST: "0.0.0.0"
      AETHERTERM_PORT: "57575"
      AETHERTERM_UNSECURE: "true"
      AETHERTERM_DEBUG: "true"
      # ControlBridge configuration (points to controlserver container)
      CONTROL_SERVER_ROUTER: "tcp://controlserver:8766"
      CONTROL_SERVER_PUB: "tcp://controlserver:8767"
      CONTROL_SERVER_SUB: "tcp://controlserver:8769"
    command:
      [
        "aetherterm-agentserver",
        "--host=0.0.0.0",
        "--port=57575",
        "--unsecure",
        "--debug",
      ]
    volumes:
      - aetherterm-logs:/var/log/aetherterm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:57575/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # ============================================================
  # OpenWeb UI - Advanced Chat Interface
  # ============================================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WEBUI_AUTH=False
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
    restart: unless-stopped

volumes:
  aetherterm-logs:
  open-webui:
