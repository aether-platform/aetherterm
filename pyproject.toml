[build-system]
requires = ["setuptools>=61.0.0"] # プロジェクトをビルドするために必要なツール
build-backend = "setuptools.build_meta"

[project]
name = "aetherterm"
version = "0.0.1"
description = "A sleek web based terminal emulator"
readme = "README.md"
requires-python = "==3.12.*"
authors = [
    {name = "Kazushige Takeuchi", email = "kaz@re-x.info"}
]
keywords = ["terminal", "web", "emulator", "websocket"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Terminals"
]

dependencies = [
    "dependency-injector>=2.20.1",
    "python-socketio",
    "uvicorn",
    "fastapi",
    "pydantic>=2.0.0",
    "python-multipart",
    "jinja2",
    "libsass",
    "pyopenssl",
    "click",
    "websockets",
    "httpx",
    # ZMQ Agent間通信
    "pyzmq>=25.0.0",
    "msgpack>=1.0.0",
    # LLM integration for log analysis
    "litellm>=1.0.0",
]

[project.optional-dependencies]
nats = ["nats-py>=2.9.0"]
themes = ["libsass"]
dev = ["ruff", "pre-commit", "mypy", "pytest", "pytest-cov", "pytest-asyncio"]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "coverage[toml]>=7.0.0",
]
jupyter = [
    "jupyter-server-proxy>=4.0.0",
    "jupyter-server>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/aether-platform/aetherterm"
Repository = "https://github.com/aether-platform/aetherterm"
Issues = "https://github.com/aether-platform/aetherterm/issues"

[project.scripts]
aetherterm = "aetherterm.scripts.aetherterm:main"
aether = "aetherterm.scripts.aetherterm:main"
aetherterm-agentserver = "aetherterm.agentserver.main:main"
aetherterm-agentshell = "aetherterm.agentshell.main:main"
aetherterm-controlserver = "aetherterm.controlserver.main:main"
aetherterm-shell-monitor = "aetherterm.agentshell.pty_monitor.main:main"
aetherterm-dummy-ai = "aetherterm.agentshell.pty_monitor.dummy_ai_server:main"
aetherterm-generate-ssl = "aetherterm.scripts.generate_ssl_certs:main"
aetherterm-tmux = "aetherterm.scripts.tmux_cli:tmux"

[project.entry-points."jupyter_serverproxy_servers"]
term = "aetherterm.scripts.jupyter_proxy:setup_aetherterm"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aetherterm = [
    "agentserver/web/sass/*.sass",
    "agentserver/web/themes/*.*",
    "agentserver/web/themes/*/*.*",
    "agentserver/web/themes/*/*/*.*",
    "agentserver/web/static/fonts/*",
    "agentserver/web/static/favicon.ico",
    "agentserver/web/static/index.html",
    "agentserver/web/static/assets/*",
    "agentserver/web/templates/index.html",
    "agentserver/web/templates/motd.j2",
    "agentserver/web/__init__.py",
    "agentserver/bin/*",
    "agentserver/terminals/*.py",
    "aetherterm.conf.default"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
follow_imports = "silent"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = true

[tool.wheel]
universal = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B108", "B301", "B324", "B701"]

[dependency-groups]
dev = [
    "hypercorn>=0.17.3",
]
